[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dd-backend"
version = "0.1.0"
description = "D2 platform runtime: API, registry, single worker, run storage for decision_diff"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    # D1/D4 core is pinned by commit in requirements.lock / requirements.txt
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "openapi-spec-validator>=0.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dd_backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
