[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-diff-core"
version = "0.2.0"
requires-python = ">=3.11"
description = "Normalization and reporting core for strategy change analysis"
dependencies = [
    "duckdb>=1.1,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["decision_diff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
