
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "decision-diff-core"
version = "0.1.0"
description = "Core library for comparing decision strategy results"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["decision_diff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
