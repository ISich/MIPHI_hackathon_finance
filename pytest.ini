[pytest]
testpaths = tests
addopts = -p no:cacheprovider -ra
xfail_strict = true
markers =
    contract: offline contract tests of core/D4 (real decision_diff + real DuckDB, no doubles unless marked)
    http: black-box HTTP tests; need QA_BASE_URL (loopback only)
    test_double: test uses an explicitly labelled test double instead of the real core/mart
    slow: runs a real pipeline end to end and may take tens of seconds
